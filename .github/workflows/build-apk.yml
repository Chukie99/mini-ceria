name: Build APK (Mini Ceria)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor & prepare www
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp -r index.html css js assets content www/ 2>/dev/null || true
          echo "www contents:" && ls -R www | head -n 40
          cat capacitor.config.json

      - name: Init Capacitor (skip if exists)
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Mini Ceria" com.sopian.miniceria --web-dir="www"
          else
            echo "capacitor.config.json already exists"
            cat capacitor.config.json
          fi

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android already exists"
          fi

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniCeria-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
