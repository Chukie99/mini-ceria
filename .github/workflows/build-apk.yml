name: Build APK (Mini Ceria)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor & prepare www
        run: |
          npm init -y
          npm i @capacitor/core@6.2.2 @capacitor/cli@6.2.2 @capacitor/android@6.2.2
          mkdir -p www
          # v9: single-file offline (dunia pintar) - keep www/index.html clean
          cp index.html www/index.html
          echo "www contents:" && ls -lh www && ls -R www | head -n 40
          cat capacitor.config.json

      - name: Init Capacitor (skip if exists)
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Mini Ceria" com.sopian.miniceria --web-dir="www"
          else
            echo "capacitor.config.json already exists"
            cat capacitor.config.json
          fi

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android already exists"
          fi

      - name: Apply custom icon to Android (if icon-*.png exists)
        run: |
          echo "Applying custom icons..."
          for res in "mipmap-hdpi:72" "mipmap-mdpi:48" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            folder="${res%%:*}"
            size="${res##*:}"
            src="icon-${size}.png"
            dst="android/app/src/main/res/${folder}/ic_launcher.png"
            dst2="android/app/src/main/res/${folder}/ic_launcher_round.png"
            if [ -f "$src" ]; then
              echo "Copy $src -> $dst"
              cp "$src" "$dst"
              cp "$src" "$dst2"
            fi
          done
          # also splash
          if [ -f "splash-port.png" ]; then
            mkdir -p android/app/src/main/res/drawable
            cp splash-port.png android/app/src/main/res/drawable/splash.png || true
          fi
          ls -lh android/app/src/main/res/mipmap-*/* 2>&1 | head -n 20

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Configure Release Signing
        run: |
          cp release.keystore android/app/release.keystore
          echo "storeFile=release.keystore" > android/keystore.properties
          echo "storePassword=duniapintar123" >> android/keystore.properties
          echo "keyAlias=dunia-pintar" >> android/keystore.properties
          echo "keyPassword=duniapintar123" >> android/keystore.properties
          cat android/keystore.properties
          # inject signingConfigs into app/build.gradle if not exists
          if ! grep -q "signingConfigs" android/app/build.gradle; then
            # add signingConfigs before buildTypes
            sed -i '/buildTypes/i \    signingConfigs {\n        release {\n            def ksProps = new Properties()\n            def ksFile = rootProject.file("keystore.properties")\n            if (ksFile.exists()) ksProps.load(new FileInputStream(ksFile))\n            storeFile file(ksProps["storeFile"] ?: "release.keystore")\n            storePassword ksProps["storePassword"]\n            keyAlias ksProps["keyAlias"]\n            keyPassword ksProps["keyPassword"]\n        }\n    }' android/app/build.gradle
            # set release buildType to use signingConfig
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' android/app/build.gradle || true
            sed -i '/release {/a \            signingConfig signingConfigs.release' android/app/build.gradle
            echo "Patched build.gradle signing"
          fi
          cat android/app/build.gradle | grep -A 12 "signingConfigs" | head -n 30

      - name: Build Release APK (signed)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build Debug APK (fallback)
        working-directory: android
        run: |
          ./gradlew assembleDebug || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuniaPintar-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniCeria-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
