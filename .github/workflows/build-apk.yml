name: Build APK (Mini Ceria)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor & prepare www
        run: |
          npm init -y
          npm i @capacitor/core@6.2.2 @capacitor/cli@6.2.2 @capacitor/android@6.2.2
          mkdir -p www
          # v9: single-file offline (dunia pintar) - keep www/index.html clean
          cp index.html www/index.html
          echo "www contents:" && ls -lh www && ls -R www | head -n 40
          cat capacitor.config.json

      - name: Init Capacitor (skip if exists)
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Mini Ceria" com.sopian.miniceria --web-dir="www"
          else
            echo "capacitor.config.json already exists"
            cat capacitor.config.json
          fi

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android already exists"
          fi

      - name: Apply custom icon to Android (if icon-*.png exists)
        run: |
          echo "Applying custom icons..."
          for res in "mipmap-hdpi:72" "mipmap-mdpi:48" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            folder="${res%%:*}"
            size="${res##*:}"
            src="icon-${size}.png"
            dst="android/app/src/main/res/${folder}/ic_launcher.png"
            dst2="android/app/src/main/res/${folder}/ic_launcher_round.png"
            if [ -f "$src" ]; then
              echo "Copy $src -> $dst"
              cp "$src" "$dst"
              cp "$src" "$dst2"
            fi
          done
          # also splash
          if [ -f "splash-port.png" ]; then
            mkdir -p android/app/src/main/res/drawable
            cp splash-port.png android/app/src/main/res/drawable/splash.png || true
          fi
          ls -lh android/app/src/main/res/mipmap-*/* 2>&1 | head -n 20

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniCeria-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
